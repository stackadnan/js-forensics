name: Publish to PyPI

# Runs when a GitHub release is published. Uploads with PyPI trusted
# publishing, so no API token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pytest
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('js-forensics'))")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
