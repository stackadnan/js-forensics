name: Bug report
description: Something crashes, or a result is wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private reporting, not here: see SECURITY.md.
        Do not attach real malware or code you may not share. Reduce the input to the few lines that show the problem.
  - type: input
    id: version
    attributes:
      label: JS Forensics version
      description: Output of `js-forensics --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: js-forensics deobfuscate sample.js --output-dir out/
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal JavaScript input
      render: javascript
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, error message, and exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
