[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "js-forensics"
version = "0.1.0"
description = "Static analysis toolkit for inspecting minified, obfuscated, or suspicious JavaScript without executing it."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["javascript", "static-analysis", "deobfuscation", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
    "typer>=0.19",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
js-forensics = "js_forensics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/js_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",  # assert is the point of the test suite
    "SIM905",  # word lists read better as one split string
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]  # tests launch the installed CLI in a subprocess

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
